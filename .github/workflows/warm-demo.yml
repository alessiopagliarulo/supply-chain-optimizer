# Keep the demo awake before you show it to someone.
#
# WHY THIS EXISTS
# ---------------
# Both Render services are on the free tier, which spins a service down after
# roughly 15 minutes with no traffic. Waking it is not fast: a cold request to
# `/version` was measured at OVER 60 SECONDS on 2026-09-04. The import-time fix
# (32-43s -> 1.0s) was real, but it is not the bottleneck — container boot is.
#
# That is survivable on a laptop and fatal at a career fair. You tap the link in
# front of a recruiter, the page hangs for a full minute, and the story you were
# telling is now a story about a broken site.
#
# HOW TO USE IT
# -------------
# Actions tab -> "Warm the demo" -> "Run workflow". Do it ~3 minutes before you
# need the link. It pings both services every 5 minutes for `minutes` minutes so
# they never idle out while you are talking. The GitHub mobile app can start it,
# so this works from your phone in a queue.
#
# THE SCHEDULE, AND THE INSTANCE-HOUR MATH BEHIND IT
# --------------------------------------------------
# This file used to argue that a cron was unaffordable because it would hold
# "TWO services awake 24/7". That reasoning was wrong on both counts; corrected
# 2026-09-08 against the live Render API:
#   - Static sites consume ZERO instance-hours. The UI is `runtime: static`
#     (render.yaml:80-85), so it was never on the bill and never sleeps. Its
#     root was measured at 0.279 s while the API was still asleep.
#   - The account has exactly ONE free web service — the API. That is the only
#     thing spending hours and the only thing that spins down.
# So the real budget is 750 instance-hours/month against one service. Awake
# 24/7 costs 720-744h: it fits, but with under 6 hours of headroom, and
# overrunning SUSPENDS the API until the month rolls over. Not worth the risk.
#
# The cron below therefore covers waking hours only — every 10 minutes from
# 12:00-23:59 UTC (08:00-19:59 US Eastern), ~12 h/day, ~365 h/month. That is
# under half the allowance and it covers any career fair, interview, or cold
# link click during the hours a human might actually open it. Outside that
# window the service is allowed to sleep and the first visitor pays the wake.
#
# HONEST LIMIT: GitHub's scheduled workflows are routinely delayed 5-20 minutes
# under load, so a 10-minute cron will sometimes miss the ~15-minute idle
# window. This makes a cold start rare; it does not make it impossible. For a
# hard guarantee, either run this manually before you need the link (see above)
# or move the API to a paid Render instance — at which point this file stops
# being necessary at all: delete it rather than leaving a cron nobody remembers.
#
# A SCHEDULED run does ONE ping round and exits (MINUTES=5 makes the loop break
# after round 1). Only a MANUAL run holds the services awake for a whole window.
#
# It is also a genuine check, not a no-op: a non-2xx from either service fails
# the run, so "the demo is awake" is something you have SEEN succeed rather than
# something you assumed.

name: Warm the demo

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep it awake (minutes)"
        required: false
        default: "90"
  schedule:
    # Every 10 min, 12:00-23:59 UTC == 08:00-19:59 US Eastern. Read the
    # instance-hour math in the header before widening this window.
    - cron: "*/10 12-23 * * *"

permissions:
  contents: read

jobs:
  warm:
    name: Keep both services awake
    runs-on: ubuntu-latest
    # Hard ceiling so a mistyped input can never pin a job for six hours.
    timeout-minutes: 200

    steps:
      - name: Ping until the window closes
        env:
          API: https://supply-chain-api-qy8x.onrender.com
          UI: https://supply-chain-ui-bhwz.onrender.com
          # Empty on a `schedule` event, so fall back to 5 — the loop then breaks
          # after one round instead of pinning a runner for the 90-minute default.
          MINUTES: ${{ github.event.inputs.minutes || '5' }}
        run: |
          set -uo pipefail

          mins="${MINUTES:-90}"
          case "$mins" in
            ''|*[!0-9]*) echo "::error::minutes must be a whole number, got '$mins'"; exit 1 ;;
          esac
          if [ "$mins" -lt 1 ] || [ "$mins" -gt 180 ]; then
            echo "::error::minutes must be between 1 and 180, got '$mins'"
            exit 1
          fi

          deadline=$(( $(date +%s) + mins * 60 ))
          round=0
          fails=0

          # The FIRST ping is the expensive one — it pays the cold start. Give it
          # a long timeout and report how long it actually took, because that
          # number is the thing worth knowing before you rely on the link.
          echo "Warming for ${mins} minute(s). The first request pays the cold start."

          while :; do
            round=$((round + 1))
            now=$(date -u +%H:%M:%S)

            # A 200 is NOT sufficient on its own. The UI is a single-page app, so
            # its host answers 200 with index.html for ANY path — a status-only
            # check would pass against a URL that does not exist, which is
            # exactly the unfalsifiable check this repo refuses to ship. So also
            # require `application/json`: /version.json is a real built file
            # (verified 2026-09-04 — it returns the commit; a bogus path returns
            # text/html), and the SPA fallback cannot satisfy that content type.
            for pair in "API:${API}/version" "UI:${UI}/version.json"; do
              name="${pair%%:*}"
              url="${pair#*:}"
              # content_type is LAST because it contains a space
              # ("text/html; charset=utf-8"). Read it into the final field so it
              # absorbs the remainder instead of shifting the columns along and
              # putting "charset=utf-8" into the elapsed-time slot.
              read -r code secs ctype < <(
                curl -s -o /dev/null --max-time 180 \
                     -w '%{http_code} %{time_total} %{content_type}\n' "$url" \
                  || echo "000 0 none"
              )
              case "$ctype" in
                application/json*) is_json=1 ;;
                *)                 is_json=0 ;;
              esac
              if [ "$code" = "200" ] && [ "$is_json" = "1" ]; then
                echo "  ${now}  round ${round}  ${name}  ${code}  ${secs}s"
              else
                echo "::warning::${now} round ${round} ${name} returned ${code} (${ctype}) after ${secs}s"
                fails=$((fails + 1))
              fi
            done

            # Stop BEFORE sleeping past the deadline, so the job ends on time
            # rather than one full interval late.
            [ "$(date +%s)" -ge "$((deadline - 300))" ] && break
            sleep 300
          done

          echo
          if [ "$fails" -gt 0 ]; then
            echo "::error::${fails} ping(s) did not return 200 — do not assume the demo is up."
            exit 1
          fi
          echo "Both services answered 200 on every one of ${round} round(s). The demo is awake."
