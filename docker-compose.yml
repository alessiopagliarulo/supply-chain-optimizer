# OPTIONAL local Postgres stack. Nothing depends on this file.
#
# The application ships on SQLite: render.yaml pins
# DATABASE_URL=sqlite:///./supply_chain.db, QUICK_START.md's five-minute path
# needs no containers at all, and CI runs against the committed SQLite artifact.
# This compose file exists so the PostgreSQL support in the SQLAlchemy layer can
# actually be exercised locally, which is the only way that support stays
# honest. It is not the deployment path and is not what any published figure
# was produced on.
#
#   docker compose up   # requires POSTGRES_PASSWORD and SECRET_KEY in .env
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logistics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-logistics_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logistics_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistics_db}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
