[pytest]
markers =
    slow: artifact pins that only reproduce on the artifacts' own platform (macOS/arm64)
        or need a downloaded model cache. Run with no `-m` filter locally and by the
        `python` job of .github/workflows/repo-tests.yml; see the block comment above
        section 6 of tests/test_artifacts_pinned_to_code.py.
    integration: hits the live network (FRED / NY Fed / DigiKey). Registered so the
        marker is filterable and not warning-noise. NOT excluded from CI or from the
        standing gate — these tests must keep running. They no longer rewrite the
        committed seed CSVs: the fetch path only writes when a deliberate retrain
        passes refresh_cache=True (see backend/app/ml/fred_client.py).
    model_ci: a MODEL CI GATE — an automated check that a defect which has actually
        shipped from this repo cannot ship again (train/serve schema divergence, a
        model that loses to its own baseline, a collapsed serve-time answer rate, a
        near-constant predictor, an endpoint that cannot accept its model's inputs,
        an artifact with no provenance). Run alone with `-m model_ci`; the
        `model-ci` GitHub workflow does exactly that with MODEL_CI_STRICT=1, which
        turns a SKIPPED gate into a failure. See docs/MODEL_CI.md.
